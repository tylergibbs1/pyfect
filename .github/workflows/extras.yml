name: extras

# The slow checks beside the test suite: the benchmark gate, the base install, the free-threaded
# runtime suites and a six-minute soak. They guard main and every release, but no single change
# needs their answer to move on, so they run on main, in the merge queue, before a release
# (release.yml) and on demand. Until the merge queue is on (repository variable MERGE_QUEUE=on),
# a pull request runs them too, as it did before they moved here.
#
# `extras` is their one check: it passes when they all passed, or when this run is one that
# doesn't run them (a pull request once the merge queue checks them).

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extras-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUNS_EXTRAS: ${{ github.event_name != 'pull_request' || vars.MERGE_QUEUE != 'on' }}

jobs:
  benchmarks:
    # Fails when a stream or fiber pipeline is more than 1.6x slower than benchmarks/baseline.json,
    # measured against a pure-Python calibration so the runner's speed cancels out; runners still
    # differ by up to 1.6x on fork-heavy, so it catches only drift. compare.py catches one change:
    # it alternates this commit with its branch base on the same runner, within a few percent.
    if: github.event_name != 'pull_request' || vars.MERGE_QUEUE != 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Benchmark gate
        working-directory: benchmarks
        run: uv run --python 3.13 python gate.py

      - name: Compare with the branch base
        working-directory: benchmarks
        run: uv run --python 3.13 python compare.py

  base-install:
    # What `uv add pyfect-dev` gives a user: no extras, no pytest.
    # QA api-surface F1/F2: `import pyfect` and the pytest plugin once failed
    # without httpx, and no test ran without the extras.
    if: github.event_name != 'pull_request' || vars.MERGE_QUEUE != 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: CPUs
        run: |
          nproc
          lscpu | grep -E '^CPU\(s\)|Thread|Core|Model name'

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install with no extras and run a program
        run: |
          uv venv -q --python 3.13 "$RUNNER_TEMP/base"
          uv pip install -q --python "$RUNNER_TEMP/base/bin/python" .
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/base/bin/python" -I -c "import pyfect as fx; import pyfect.testing; assert fx.run_sync(fx.succeed(1)) == 1"

      - name: Base-install tests (every module imports or names its extra; the pytest plugin loads)
        run: uv run pytest -q -n auto tests/test_install.py

  free-threaded:
    # QA concurrency 2: a cross-thread resume racing registration hung only
    # without the GIL. Runs the stress, the shared-state primitives shared by runs
    # on several threads (tests/cross_run) and the runtime suites on CPython 3.14t.
    if: github.event_name != 'pull_request' || vars.MERGE_QUEUE != 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHON_GIL: "0"
      PYFECT_REQUIRE_FREE_THREADED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install gdb (a hung test's report carries native stacks, tests/_native_stacks.py)
        # py-spy can't read a free-threaded process. The mirrors once took 3 minutes of the job's
        # 4; past 1 the tests run without gdb, and a hang's report says so.
        timeout-minutes: 1
        continue-on-error: true
        run: command -v gdb >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq gdb; }

      - name: Install CPython 3.14t with pyfect and pytest
        run: |
          uv python install 3.14t
          uv venv -q --python 3.14t "$RUNNER_TEMP/ft"
          uv pip install -q --python "$RUNNER_TEMP/ft/bin/python" . pytest pytest-xdist
          "$RUNNER_TEMP/ft/bin/python" -c "import sys; assert not sys._is_gil_enabled(), 'GIL enabled'"

      - name: Concurrency stress and runtime suites without the GIL
        run: |
          # The suites are listed in tests/free_threaded_suites.txt, which flakes-nightly.yml repeats.
          "$RUNNER_TEMP/ft/bin/python" -m pytest -q -n auto -p no:cacheprovider $(sed 's/#.*//' tests/free_threaded_suites.txt)

  soak-short:
    # Six minutes of tests/soak (soak.yml runs it for hours): leaks, stuck fibers, stalls,
    # unexpected failures and the shutdown are judged; latency needs a longer baseline
    # than minutes on a shared runner, so it is not.
    if: github.event_name != 'pull_request' || vars.MERGE_QUEUE != 'on'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.14t"]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install
        run: |
          uv python install ${{ matrix.python }}
          uv venv -q --python ${{ matrix.python }} "$RUNNER_TEMP/soak"
          uv pip install -q --python "$RUNNER_TEMP/soak/bin/python" '.[httpx,websockets,crypto]'

      - name: Soak for six minutes
        working-directory: tests
        run: |
          if [ "${{ matrix.python }}" = "3.14t" ]; then export PYTHON_GIL=0; fi
          "$RUNNER_TEMP/soak/bin/python" -m soak run --duration 6m --interval 3s \
            --warmup 90s --no-latency --out "$GITHUB_WORKSPACE/.soak/soak-short.jsonl"

      - name: Upload the health samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-short-${{ matrix.python }}
          path: .soak/*.jsonl
          if-no-files-found: warn

  extras:
    needs: [benchmarks, base-install, free-threaded, soak-short]
    # Runs when one failed too: a skipped required check would count as passed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every extra passed, or this run is not one that runs them
        env:
          RESULTS: ${{ needs.benchmarks.result }} ${{ needs.base-install.result }} ${{ needs.free-threaded.result }} ${{ needs.soak-short.result }}
        run: |
          echo "runs extras: $RUNS_EXTRAS; benchmarks, base-install, free-threaded, soak-short: $RESULTS"
          expected=$([ "$RUNS_EXTRAS" = true ] && echo success || echo skipped)
          for result in $RESULTS; do [ "$result" = "$expected" ] || exit 1; done
