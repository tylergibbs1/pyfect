name: soak-nightly

# The nightly long run behind scripts/stability.py's bar. `cluster` reruns the cluster and
# workflow suites on PostgreSQL and MySQL (and SQLite) round after round for 100 minutes: the
# cluster-integration tests kill runners and restart whole clusters mid-workflow
# (cluster.kill), and the SQL storage tests run on both servers. `soak` runs tests/soak, the
# runtime's long health workload, for as long. A failed round ends its job at once: nothing
# retries, and the failure opens (or comments on) one "Nightly soak failed" issue here.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes each job keeps starting rounds
        default: "100"

permissions:
  contents: read

concurrency:
  group: soak-nightly
  cancel-in-progress: false

env:
  MINUTES: ${{ inputs.minutes || '100' }}

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: CPUs
        run: |
          nproc
          lscpu | grep -E '^CPU\(s\)|Thread|Core|Model name'

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/container-images
        with:
          mode: save

  cluster:
    needs: images
    runs-on: ubuntu-latest
    # The rounds stop starting at MINUTES; the last one and the setup fit in the rest.
    timeout-minutes: 125
    env:
      UV_PYTHON: "3.14"
      EFFECT_COMMIT: 506eef143bcc1750ce58920aac1e45da7265d103 # Effect 4.1.2, as ../pyfect-ref/effect
      PYFECT_EFFECT_REF: ${{ github.workspace }}/.effect
      PYFECT_REF: ${{ github.workspace }}/.effect
      # A test skipped for a missing server fails the round (tests/_skips.py).
      PYFECT_REQUIRE_ALL_TESTS: "1"
    steps:
      - name: CPUs
        run: |
          nproc
          lscpu | grep -E '^CPU\(s\)|Thread|Core|Model name'

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/container-images
        with:
          mode: load

      - uses: ./.github/actions/check-setup
        with:
          python: "3.14"

      - name: Cluster and workflow rounds
        run: |
          deadline=$(( $(date +%s) + MINUTES * 60 ))
          round=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            round=$((round + 1))
            echo "::group::round $round"
            # Each round in a new random order; its seed is in the log's last lines.
            if ! uv run --no-sync pytest -q -rfEs -n auto \
                tests/oracle/test_cluster_*.py tests/oracle/test_workflow*.py \
                tests/oracle/test_sql_message_storage.py tests/oracle/test_sql_runner_storage*.py; then
              echo "::endgroup::"
              echo "::error title=Nightly cluster soak failed::round $round failed; its seed and failures are above"
              exit 1
            fi
            echo "::endgroup::"
          done
          echo "$round rounds passed"
          [ "$round" -gt 0 ]

  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - name: CPUs
        run: |
          nproc
          lscpu | grep -E '^CPU\(s\)|Thread|Core|Model name'

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install
        run: |
          uv python install 3.14
          uv venv -q --python 3.14 "$RUNNER_TEMP/soak"
          uv pip install -q --python "$RUNNER_TEMP/soak/bin/python" '.[httpx,websockets,crypto]'

      - name: Soak
        working-directory: tests
        run: |
          "$RUNNER_TEMP/soak/bin/python" -m soak run \
            --duration "${MINUTES}m" --interval 30s \
            --out "$GITHUB_WORKSPACE/.soak/soak-nightly.jsonl"

      - name: Upload the health samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-nightly
          path: |
            .soak/*.jsonl
            .soak/*.stacks.txt
          if-no-files-found: warn

  report:
    needs: [images, cluster, soak]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or comment on the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: "images: ${{ needs.images.result }}, cluster: ${{ needs.cluster.result }}, soak: ${{ needs.soak.result }}"
        run: |
          title="Nightly soak failed"
          body="$RUN ($RESULTS)"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
