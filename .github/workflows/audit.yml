name: audit

# Checks the locked dependencies (uv.lock and website/bun.lock) against known vulnerabilities
# (OSV) on pushes to main, pull requests and the merge queue, and weekly, so an advisory
# published after a release still shows up. tests/test_workflow_security.py keeps every
# workflow's actions pinned. An ignored advisory needs a reason and an `until` date at most 30
# days out (tests/test_ci_workflows.py), so it is rechecked instead of outliving its reason.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: CPUs
        run: |
          nproc
          lscpu | grep -E '^CPU\(s\)|Thread|Core|Model name'

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # `uv audit` is a preview command; a pinned uv keeps its output and flags stable.
          version: "0.12.15"
          enable-cache: false

      - name: Audit uv.lock (every extra and group)
        run: uv audit --locked --preview-features audit-command

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Audit website/bun.lock
        working-directory: website
        # GHSA-fc5q-39xc-vjpf (picomatch ReDoS, no fixed release yet): picomatch is build-time
        # only, through fumadocs-mdx and fumadocs-core > tinyglobby > fdir; its globs come only from
        # the repo's config, and nothing in the deployed runtime uses it. until 2026-12-08
        run: bun audit --ignore=GHSA-fc5q-39xc-vjpf
