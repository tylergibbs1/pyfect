name: docs

on:
  # One commit, one run: pull requests are checked by their pull_request run, so a push runs
  # only on main.
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request replaces its run; runs on main, releases and the merge queue
# are never cancelled.
concurrency:
  # github.event.number is the pull request's number (tests/test_workflow_security.py bans
  # interpolating github.event.pull_request).
  group: docs-${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `snippets` (after `images`), `reference` and `site` run side by side; `build`, the job branch
# protection requires, passes only if all of them did. Each job's timeout is about its p95 plus
# 30%, so a job that gets slower fails instead of quietly taking longer.
jobs:
  # Whether the site has to be built. Only a pull request may skip it, when its diff touches
  # nothing the site or its checks read; pushes to main, the merge queue and releases always build.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: github.event_name == 'pull_request'
        with:
          # A pull request checks out its merge commit: its first parent is the base.
          fetch-depth: 2

      - name: Does the change touch the site?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          # What the site, its build and its checks read.
          SITE_INPUTS: '^(website/|src/|tests/|assets/|\.github/|README\.md$|pyproject\.toml$|uv\.lock$|\.python-version$)'
        run: |
          site=true
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            grep -qE "$SITE_INPUTS" <<< "$changed" || site=false
          fi
          echo "site: $site"
          echo "site=$site" >> "$GITHUB_OUTPUT"

  images:
    # The container images the server-backed snippets run, pulled once and cached as archives
    # (.github/actions/container-images, as in ci.yml): the snippets job pulled SQL Server, MySQL
    # and ClickHouse from their registries on every run, inside its 3-minute budget.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/container-images
        with:
          mode: save

  snippets:
    # Pyright checks the snippets in ci.yml's types job (pyproject.toml's include), on the same
    # events as this workflow; this job runs them.
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: CPUs
        run: |
          nproc
          lscpu | grep -E '^CPU\(s\)|Thread|Core|Model name'
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/container-images
        with:
          mode: load

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run the guides' snippets
        # Serial: the tests' fixture already runs the snippets side by side on every CPU but
        # one; each xdist worker would start every snippet again.
        run: uv run pytest -q tests/test_doc_snippets.py

      - name: The job took under 80% of its budget
        # TIMEOUT_MINUTES is the job's timeout-minutes (tests/test_ci_workflows.py): a job that
        # creeps toward its timeout fails here first, with its time, before one is cancelled.
        env:
          TIMEOUT_MINUTES: 3
        run: |
          took=$(( $(date +%s) - JOB_START ))
          budget=$(( TIMEOUT_MINUTES * 60 ))
          echo "snippets took ${took} s of its ${budget} s budget"
          [ $(( took * 100 )) -le $(( budget * 80 )) ] || { echo "::error::snippets took ${took} s, over 80% of its ${budget} s budget"; exit 1; }

  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install site dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Check the API reference documents every module, value and overload
        # Serial: one generator run (a single process, most of the time) feeds every test; each
        # xdist worker would run it again.
        run: uv run pytest -q tests/test_api_reference.py

      - name: Check the README diagram matches its source
        working-directory: website
        run: node scripts/readme-diagram.mjs --check

  site:
    needs: [changes]
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install site dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Generate the API reference JSON
        working-directory: website
        run: bun run generate:api

      - name: Build the site
        working-directory: website
        # Next retries a page that takes over a minute (up to three attempts, not configurable):
        # a retried page is a slow page, so it fails the build here.
        run: |
          bun run build 2>&1 | tee "$RUNNER_TEMP/build.log"
          ! grep -F "Retrying again shortly" "$RUNNER_TEMP/build.log"

      - name: Check that every page uses the same frame and nothing shifts
        working-directory: website
        run: bun run check:layout

  build:
    needs: [changes, images, snippets, reference, site]
    # Runs when one failed too: a skipped required check would count as passed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: The snippets, the reference and the site passed
        env:
          CHANGES: ${{ needs.changes.result }}
          IMAGES: ${{ needs.images.result }}
          SNIPPETS: ${{ needs.snippets.result }}
          REFERENCE: ${{ needs.reference.result }}
          SITE: ${{ needs.site.result }}
          SITE_NEEDED: ${{ needs.changes.outputs.site }}
        run: |
          echo "changes: $CHANGES (site needed: $SITE_NEEDED), images: $IMAGES, snippets: $SNIPPETS, reference: $REFERENCE, site: $SITE"
          [ "$CHANGES" = success ] && [ "$IMAGES" = success ] && [ "$SNIPPETS" = success ] && [ "$REFERENCE" = success ] &&
            { [ "$SITE" = success ] || { [ "$SITE" = skipped ] && [ "$SITE_NEEDED" = false ]; }; }
