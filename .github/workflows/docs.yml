name: docs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Check the guides' snippets (pyright, pytest)
        run: |
          uv run pyright website/snippets
          uv run pytest -q tests/test_doc_snippets.py

      - name: Install site dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Check the API reference documents every module, value and overload
        run: uv run pytest -q tests/test_api_reference.py

      - name: Check the README diagram matches its source
        working-directory: website
        run: node scripts/readme-diagram.mjs --check

      - name: Generate the API reference JSON
        working-directory: website
        run: bun run generate:api

      - name: Build the site
        working-directory: website
        run: bun run build

      - name: Check that every page uses the same frame and nothing shifts
        working-directory: website
        run: bun run check:layout
