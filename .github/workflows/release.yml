name: release

# Publishes pyfect-dev to PyPI when a version tag (v0.1.0, v0.2.0rc1) is pushed.
# PyPI trusts this workflow directly (trusted publishing), so no token exists.
# Build and publish are separate jobs so the publishing credential is never
# available to the build.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

permissions:
  contents: read

jobs:
  # Publish only a commit that passes the whole of CI and the docs build.
  ci:
    uses: ./.github/workflows/ci.yml

  docs:
    uses: ./.github/workflows/docs.yml

  build:
    needs: [ci, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      - name: The tag matches the project version
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: uv build

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --python 3.13 --with dist/*.whl scripts/release_smoke.py "$VERSION"

      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --python 3.13 --with dist/*.tar.gz scripts/release_smoke.py "$VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pyfect-dev/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7

      - name: Publish
        run: uv publish
