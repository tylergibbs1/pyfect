name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  # release.yml runs this whole workflow and publishes only if it passes.
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request replaces the run of its older commit, which can never reach
# main. Runs on main, for a release and in the merge queue always finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The project's full check (CLAUDE.md) on every Python pyproject.toml lists (classifiers;
# tests/test_ci_workflows.py keeps them equal), as parallel jobs: `lint` (ruff), `types`
# (pyright strict), `collect` (every test id) and `test` (the tests split across shard runners,
# tests/_shards.py). `check`, the job branch protection requires, passes only if they all passed
# and the shards together ran exactly the tests `collect` found. The tests read the Effect 4.1.4
# checkout; server-backed tests start their databases themselves.
#
# Each Python is an exact CPython patch, the newest 3.13's and 3.14's (python-build-standalone's
# releases), the same as every other workflow's and flakes-nightly.yml's newest: a runner's own
# 3.14 lagged six patches behind.
#
# One commit gets one run: a pull request is checked by its pull_request run, and a push runs
# only on main. A branch push would check the same commit a second time, and cancelling either
# copy leaves a failed required check on a commit main may move to. Each job's timeout is its
# time budget: a job that grows past it fails instead of slowly making every run longer.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: CPUs
        run: |
          nproc
          lscpu | grep -E '^CPU\(s\)|Thread|Core|Model name'

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      - name: Format and lint with the ruff uv.lock pins
        run: |
          ruff="ruff@$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"] if p["name"] == "ruff"))')"
          uvx "$ruff" format --check .
          uvx "$ruff" check .

  types:
    # Pyright reads pythonVersion from pyproject.toml, not from the interpreter, and both
    # Pythons' environments resolve the same packages, so one run checks both.
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/check-setup
        with:
          python: "3.13.18"
          tests: "false"

      - name: Types
        # One pyright process per CPU, each checking a share of the files.
        run: uv run --no-sync pyright --threads "$(nproc)"

  collect:
    name: collect (${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13.18", "3.14.10"]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      UV_PYTHON: ${{ matrix.python }}
      EFFECT_COMMIT: 289a53f7b1fc40049219c6e69022db2fb859c356 # Effect 4.1.4; tests/_effect_ref.py checks local checkouts against it
      PYFECT_EFFECT_REF: ${{ github.workspace }}/.effect
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/check-setup
        with:
          python: ${{ matrix.python }}

      - name: Collect every test (what the shards must run together)
        run: |
          mkdir -p .shards
          # Serial: collecting is one import pass; xdist workers would each collect every test.
          uv run --no-sync pytest --collect-only -p no:randomly --shard-manifest=.shards/full.txt > /dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest-${{ matrix.python }}-full
          path: .shards/full.txt
          if-no-files-found: error

  images:
    # The container images the server-backed tests run (tests/container_images.json, pinned by
    # digest), pulled once and cached as archives under a key made from that file. The shards
    # restore them and never pull from a registry: one registry hiccup used to fail a shard's
    # SQL Server tests. A failed pull fails this job once, with the image, and nothing retries.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/container-images
        with:
          mode: save

  test:
    name: test (${{ matrix.python }}, ${{ matrix.shard }}/5)
    needs: images
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13.18", "3.14.10"]
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      UV_PYTHON: ${{ matrix.python }}
      EFFECT_COMMIT: 289a53f7b1fc40049219c6e69022db2fb859c356 # Effect 4.1.4; tests/_effect_ref.py checks local checkouts against it
      PYFECT_EFFECT_REF: ${{ github.workspace }}/.effect
      # A test skipped for a missing server, binary or interpreter fails the run (tests/_skips.py).
      PYFECT_REQUIRE_ALL_TESTS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/container-images
        with:
          mode: load

      - uses: ./.github/actions/check-setup
        with:
          python: ${{ matrix.python }}

      - name: Fetch main
        # tests/test_changelog.py compares the CHANGELOG with main's: only a release commit
        # changes it.
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Warm up pwsh
        # The runner's disk is cold: pwsh's first start read its files at 3-6 MB/s and took
        # 6-35 s once the suite's containers had started (the PowerShell completion test
        # timed out). Started once here, before the tests, the test's pwsh takes about 1 s.
        run: nohup pwsh -NoLogo -NoProfile -NonInteractive -Command 'TabExpansion2 -inputScript "Get-Chil" -cursorColumn 8 | Out-Null' > /dev/null 2>&1 &

      - name: Tests
        run: |
          mkdir -p .shards
          # One worker per CPU, in random order; the log's last lines give the seed
          # (-p randomly --randomly-seed=N repeats it). tests/_parallel.py keeps in-order files
          # and each database's tests on one worker.
          uv run --no-sync pytest -q -rfEs -n auto --shard=${{ matrix.shard }}/5 \
            --shard-manifest=.shards/shard-${{ matrix.shard }}.txt \
            --shard-durations=.shards/durations-${{ matrix.shard }}.json

      - name: Upload the shard's test ids (the check job compares them with a full collection)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest-${{ matrix.python }}-${{ matrix.shard }}
          path: .shards/shard-${{ matrix.shard }}.txt
          if-no-files-found: error

      - name: Upload the shard's durations (scripts/test_shards.py update reads them)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durations-${{ matrix.python }}-${{ matrix.shard }}
          path: .shards/durations-${{ matrix.shard }}.json
          if-no-files-found: warn

  check:
    # Branch protection requires `check (3.13)` and `check (3.14)`: the name carries the minor
    # version, so a new patch in the matrix leaves the required checks as they are.
    name: check (${{ matrix.minor }})
    needs: [lint, types, collect, images, test]
    # Runs when a job failed too: a skipped required check would count as passed.
    if: always()
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13.18", "3.14.10"]
        include:
          - python: "3.13.18"
            minor: "3.13"
          - python: "3.14.10"
            minor: "3.14"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - name: Lint, types, the collection and every shard passed
        env:
          LINT: ${{ needs.lint.result }}
          TYPES: ${{ needs.types.result }}
          COLLECT: ${{ needs.collect.result }}
          IMAGES: ${{ needs.images.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "lint: $LINT, types: $TYPES, collect: $COLLECT, images: $IMAGES, test: $TEST"
          [ "$LINT" = success ] && [ "$TYPES" = success ] && [ "$COLLECT" = success ] && [ "$IMAGES" = success ] && [ "$TEST" = success ]

      # The steps below run whatever the first found, so a failure also says whether a test
      # was left out.
      - if: always()
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts

      # gh, not actions/download-artifact: after a blob request that failed and was retried,
      # the action keeps node alive until the socket's 3-minute timeout (actions/toolkit#2575),
      # past this job's budget.
      - name: Download the shards' test ids
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'manifest-${{ matrix.python }}-*' --dir .shards

      - name: The shards ran every test exactly once
        if: always()
        run: python3 scripts/test_shards.py verify .shards/*/full.txt .shards/*/shard-*.txt
