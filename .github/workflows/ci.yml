name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  # release.yml runs this whole workflow and publishes only if it passes.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    # The project's full check (CLAUDE.md): formatting, lint, pyright strict and every test,
    # against the Effect 4.1.2 checkout the oracle tests read. Server-backed tests start their
    # databases in Docker.
    # Every Python pyproject.toml lists (classifiers); tests/test_ci_workflows.py keeps them equal.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # Every uv command below uses the matrix Python, not .python-version's.
      UV_PYTHON: ${{ matrix.python }}
      EFFECT_COMMIT: 506eef143bcc1750ce58920aac1e45da7265d103 # Effect 4.1.2, as ../pyfect-ref/effect
      PYFECT_EFFECT_REF: ${{ github.workspace }}/.effect
      PYFECT_REF: ${{ github.workspace }}/.effect
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check out Effect 4.1.2
        run: |
          git init -q .effect
          git -C .effect fetch -q --depth 1 https://github.com/Effect-TS/effect.git "$EFFECT_COMMIT"
          git -C .effect checkout -q FETCH_HEAD

      - name: Install
        run: |
          uv sync --locked --python ${{ matrix.python }}
          uv run python -c "import sys; assert f'{sys.version_info.major}.{sys.version_info.minor}' == '${{ matrix.python }}', sys.version"

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run pyright

      - name: Tests
        run: uv run pytest -q -p no:randomly -rfEs

  benchmarks:
    # Fails when a stream or fiber pipeline is more than 1.6x slower than benchmarks/baseline.json,
    # measured against a pure-Python calibration so the runner's speed cancels out.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Benchmark gate
        working-directory: benchmarks
        run: uv run --python 3.13 python gate.py

  base-install:
    # What `uv add pyfect-dev` gives a user: no extras, no pytest.
    # QA api-surface F1/F2: `import pyfect` and the pytest plugin once failed
    # without httpx, and no test ran without the extras.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install with no extras and run a program
        run: |
          uv venv -q --python 3.13 "$RUNNER_TEMP/base"
          uv pip install -q --python "$RUNNER_TEMP/base/bin/python" .
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/base/bin/python" -I -c "import pyfect as fx; import pyfect.testing; assert fx.run_sync(fx.succeed(1)) == 1"

      - name: Base-install tests (every module imports or names its extra; the pytest plugin loads)
        run: uv run pytest -q tests/test_install.py

  free-threaded:
    # QA concurrency 2: a cross-thread resume racing registration hung only
    # without the GIL. Runs the stress and the runtime suites on CPython 3.14t.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON_GIL: "0"
      PYFECT_REQUIRE_FREE_THREADED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install CPython 3.14t with pyfect and pytest
        run: |
          uv python install 3.14t
          uv venv -q --python 3.14t "$RUNNER_TEMP/ft"
          uv pip install -q --python "$RUNNER_TEMP/ft/bin/python" . pytest
          "$RUNNER_TEMP/ft/bin/python" -c "import sys; assert not sys._is_gil_enabled(), 'GIL enabled'"

      - name: Concurrency stress and runtime suites without the GIL
        run: >
          "$RUNNER_TEMP/ft/bin/python" -m pytest -q -p no:cacheprovider
          tests/test_free_threaded.py
          tests/test_run_caller_context.py
          tests/test_concurrency.py
          tests/test_decided_results.py
          tests/test_fibers.py
          tests/test_interrupt_delivery.py
          tests/test_race_interruption.py
          tests/test_for_each_interruption.py
          tests/test_queue.py
          tests/test_fiber_collections.py
          tests/test_managed_runtime.py
          tests/test_base_exceptions.py
          tests/oracle/test_synchronous_resume.py
