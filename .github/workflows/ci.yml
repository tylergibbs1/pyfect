name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  # release.yml runs this whole workflow and publishes only if it passes.
  workflow_call:

permissions:
  contents: read

jobs:
  # The project's full check (CLAUDE.md) on every Python pyproject.toml lists (classifiers;
  # tests/test_ci_workflows.py keeps them equal): `lint` runs formatting, lint and pyright
  # strict, `test` runs every test split across shard runners (tests/_shards.py), and `check`,
  # the job branch protection requires, passes only if they all passed and the shards together
  # ran exactly the tests a full collection finds. The tests read the Effect 4.1.2 checkout;
  # server-backed tests start their databases in Docker.
  lint:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Every uv command below uses the matrix Python, not .python-version's.
      UV_PYTHON: ${{ matrix.python }}
      EFFECT_COMMIT: 506eef143bcc1750ce58920aac1e45da7265d103 # Effect 4.1.2, as ../pyfect-ref/effect
      PYFECT_EFFECT_REF: ${{ github.workspace }}/.effect
      PYFECT_REF: ${{ github.workspace }}/.effect
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/check-setup
        with:
          python: ${{ matrix.python }}

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run pyright

      - name: Collect every test (what the shards must run together)
        run: |
          mkdir -p .shards
          uv run pytest --collect-only -p no:randomly --shard-manifest .shards/full.txt > /dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest-${{ matrix.python }}-full
          path: .shards/full.txt
          if-no-files-found: error

  images:
    # The container images the server-backed tests run (tests/container_images.json, pinned by
    # digest), pulled once and cached as archives under a key made from that file. The shards
    # restore them and never pull from a registry: one registry hiccup used to fail a shard's
    # SQL Server tests. A failed pull fails this job once, with the image, and nothing retries.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/container-images
        with:
          mode: save

  test:
    name: test (${{ matrix.python }}, ${{ matrix.shard }}/5)
    needs: images
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON: ${{ matrix.python }}
      EFFECT_COMMIT: 506eef143bcc1750ce58920aac1e45da7265d103 # Effect 4.1.2, as ../pyfect-ref/effect
      PYFECT_EFFECT_REF: ${{ github.workspace }}/.effect
      PYFECT_REF: ${{ github.workspace }}/.effect
      # A test skipped for a missing server, binary or interpreter fails the run (tests/_skips.py).
      PYFECT_REQUIRE_ALL_TESTS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/container-images
        with:
          mode: load

      - uses: ./.github/actions/check-setup
        with:
          python: ${{ matrix.python }}

      - name: Warm up pwsh
        # The runner's disk is cold: pwsh's first start read its files at 3-6 MB/s and took
        # 6-35 s once the suite's containers had started (the PowerShell completion test
        # timed out). Started once here, before the tests, the test's pwsh takes about 1 s.
        run: nohup pwsh -NoLogo -NoProfile -NonInteractive -Command 'TabExpansion2 -inputScript "Get-Chil" -cursorColumn 8 | Out-Null' > /dev/null 2>&1 &

      - name: Tests
        run: |
          mkdir -p .shards
          uv run pytest -q -p no:randomly -rfEs --shard ${{ matrix.shard }}/5 \
            --shard-manifest .shards/shard-${{ matrix.shard }}.txt \
            --shard-durations .shards/durations-${{ matrix.shard }}.json

      - name: Upload the shard's test ids (the check job compares them with a full collection)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest-${{ matrix.python }}-${{ matrix.shard }}
          path: .shards/shard-${{ matrix.shard }}.txt
          if-no-files-found: error

      - name: Upload the shard's durations (scripts/test_shards.py update reads them)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durations-${{ matrix.python }}-${{ matrix.shard }}
          path: .shards/durations-${{ matrix.shard }}.json
          if-no-files-found: warn

  check:
    needs: [lint, images, test]
    # Runs when a shard failed too: a skipped required check would count as passed.
    if: always()
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lint and every shard passed
        env:
          LINT: ${{ needs.lint.result }}
          IMAGES: ${{ needs.images.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "lint: $LINT, images: $IMAGES, test: $TEST"
          [ "$LINT" = success ] && [ "$IMAGES" = success ] && [ "$TEST" = success ]

      # The steps below run whatever the first found, so a failure also says whether a test
      # was left out.
      - if: always()
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: manifest-${{ matrix.python }}-*
          path: .shards
          merge-multiple: true

      - name: The shards ran every test exactly once
        if: always()
        run: python3 scripts/test_shards.py verify .shards/full.txt .shards/shard-*.txt

  benchmarks:
    # Fails when a stream or fiber pipeline is more than 1.6x slower than benchmarks/baseline.json,
    # measured against a pure-Python calibration so the runner's speed cancels out; runners still
    # differ by up to 1.6x on fork-heavy, so it catches only drift. compare.py catches one change:
    # it alternates this commit with its branch base on the same runner, within a few percent.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Benchmark gate
        working-directory: benchmarks
        run: uv run --python 3.13 python gate.py

      - name: Compare with the branch base
        working-directory: benchmarks
        run: uv run --python 3.13 python compare.py

  base-install:
    # What `uv add pyfect-dev` gives a user: no extras, no pytest.
    # QA api-surface F1/F2: `import pyfect` and the pytest plugin once failed
    # without httpx, and no test ran without the extras.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install with no extras and run a program
        run: |
          uv venv -q --python 3.13 "$RUNNER_TEMP/base"
          uv pip install -q --python "$RUNNER_TEMP/base/bin/python" .
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/base/bin/python" -I -c "import pyfect as fx; import pyfect.testing; assert fx.run_sync(fx.succeed(1)) == 1"

      - name: Base-install tests (every module imports or names its extra; the pytest plugin loads)
        run: uv run pytest -q tests/test_install.py

  free-threaded:
    # QA concurrency 2: a cross-thread resume racing registration hung only
    # without the GIL. Runs the stress, the shared-state primitives shared by runs
    # on several threads (tests/cross_run) and the runtime suites on CPython 3.14t.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON_GIL: "0"
      PYFECT_REQUIRE_FREE_THREADED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install CPython 3.14t with pyfect and pytest
        run: |
          uv python install 3.14t
          uv venv -q --python 3.14t "$RUNNER_TEMP/ft"
          uv pip install -q --python "$RUNNER_TEMP/ft/bin/python" . pytest
          "$RUNNER_TEMP/ft/bin/python" -c "import sys; assert not sys._is_gil_enabled(), 'GIL enabled'"

      - name: Concurrency stress and runtime suites without the GIL
        run: >
          "$RUNNER_TEMP/ft/bin/python" -m pytest -q -p no:cacheprovider
          tests/test_free_threaded.py
          tests/cross_run
          tests/test_run_caller_context.py
          tests/test_concurrency.py
          tests/test_decided_results.py
          tests/test_fibers.py
          tests/test_interrupt_delivery.py
          tests/test_race_interruption.py
          tests/test_for_each_interruption.py
          tests/test_queue.py
          tests/test_fiber_collections.py
          tests/test_managed_runtime.py
          tests/test_base_exceptions.py
          tests/test_source_cache.py
          tests/oracle/test_synchronous_resume.py

  soak-short:
    # Six minutes of tests/soak (soak.yml runs it for hours): leaks, stuck fibers, stalls,
    # unexpected failures and the shutdown are judged; latency needs a longer baseline
    # than minutes on a shared runner, so it is not.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.14t"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install
        run: |
          uv python install ${{ matrix.python }}
          uv venv -q --python ${{ matrix.python }} "$RUNNER_TEMP/soak"
          uv pip install -q --python "$RUNNER_TEMP/soak/bin/python" '.[httpx,websockets,crypto]'

      - name: Soak for six minutes
        working-directory: tests
        run: |
          if [ "${{ matrix.python }}" = "3.14t" ]; then export PYTHON_GIL=0; fi
          "$RUNNER_TEMP/soak/bin/python" -m soak run --duration 6m --interval 3s \
            --warmup 90s --no-latency --out "$GITHUB_WORKSPACE/.soak/soak-short.jsonl"

      - name: Upload the health samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-short-${{ matrix.python }}
          path: .soak/*.jsonl
          if-no-files-found: warn
