name: guards-nightly

# Every regression test marked with the bug it guards (tests/_guards.py) must fail against a
# copy of src with that bug's patch from tests/regressions applied
# (scripts/check_regression_guards.py). An injected quadratic runs until the test's hang alarm
# stops it, so this is too slow for every pull request; that each patch still applies is
# checked per pull request (tests/test_regression_patches.py). A failure opens (or comments
# on) one "Nightly guard check failed" issue whose body is the run's link.

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guards-nightly
  cancel-in-progress: false

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install
        run: uv sync --locked --python 3.13

      - name: Run each guard against its bug
        run: uv run python scripts/check_regression_guards.py

  report:
    needs: [guards]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or comment on the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly guard check failed"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$RUN"
          else
            gh issue create --title "$title" --body "$RUN"
          fi
