[project]
name = "pyfect-dev"
version = "0.5.7"
description = "Effect-TS for Python: typed effects, a real fiber runtime, structured concurrency, services and layers."
readme = "README.md"
authors = [{ name = "Tyler Gibbs", email = "tylergibbs048@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    # TypedDict extra_items (PEP 728) for the GraphQL error schemas.
    "typing-extensions>=4.13",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://pyfect.dev"
Repository = "https://github.com/tylergibbs1/pyfect"
Documentation = "https://pyfect.dev/docs"

[project.entry-points.pytest11]
pyfect = "pyfect.testing.plugin"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.45",
    "opentelemetry-sdk>=1.45",
]
hypothesis = [
    "hypothesis>=6.140",
]
pydantic = [
    "pydantic>=2.11",
]
msgspec = [
    "msgspec>=0.19",
]
httpx = [
    "httpx>=0.28",
]
websockets = [
    "websockets>=15",
]
pg = [
    "psycopg>=3.3",
]
mysql = [
    "asyncmy>=0.2.17",
]
mssql = [
    "python-tds>=1.17",
    "pyopenssl>=25",
]
server = [
    "uvicorn>=0.38",
    "websockets>=15",
]
http2 = [
    "hypercorn>=0.18",
]
intl = [
    "babel>=2.18",
]
regex = [
    "regex>=2024.11.6",
]
redis = [
    "redis>=8.1",
]
eventlog = [
    "cryptography>=46",
    "pynacl>=1.6",
]
brotli = [
    "brotlicffi>=1.2.1",
]
crypto = [
    "cryptography>=46",
    "pynacl>=1.6",
]
watch = [
    "watchfiles>=1.3",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# docs: the API reference generator, checked by tests/test_api_reference.py
default-groups = ["dev", "docs"]

[tool.uv.build-backend]
# The distribution is pyfect-dev (PyPI's pyfect is another project); the import name is pyfect.
module-name = "pyfect"

[dependency-groups]
dev = [
    "pyfect-dev[otel]",
    "pyfect-dev[hypothesis]",
    "pyfect-dev[pydantic]",
    "pyfect-dev[msgspec]",
    "pyfect-dev[httpx]",
    "pyfect-dev[websockets]",
    "pyfect-dev[pg]",
    "pyfect-dev[mysql]",
    "pyfect-dev[mssql]",
    "pyfect-dev[server]",
    "pyfect-dev[http2]",
    "pyfect-dev[intl]",
    "pyfect-dev[regex]",
    "pyfect-dev[redis]",
    "pyfect-dev[eventlog]",
    "pyfect-dev[brotli]",
    "pyfect-dev[crypto]",
    "pyfect-dev[watch]",
    "psycopg[binary]>=3.3",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.2",
]
docs = ["griffe-typingdoc==0.2.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# An xfail that passes fails the run (tests/test_xfail_guard.py).
xfail_strict = true
# A coroutine left pending (a close never awaited before a loop stopped) or
# an exception raised where nothing can catch it fails the test that left it.
filterwarnings = [
    "error:coroutine .*was never awaited:RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    # `client[Group]` is deprecated; `cast` hides it from pyright, this does not.
    "error:client\\[Group\\]:DeprecationWarning",
    # A file, socket or pipe left for the garbage collector to close.
    "error::ResourceWarning",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests", "examples", "benchmarks", "scripts", "website/snippets"]
reportUnnecessaryTypeIgnoreComment = true
# Calling a deprecated API is an error.
reportDeprecated = "error"
exclude = ["research"]
pythonVersion = "3.13"
# Pyright infers the *send* type of an unannotated generator as Unknown
# (microsoft/pyright#10279). Effect generators never use the send type, but
# strict flags every one of them. Parameters are still required to be
# annotated by reportMissingParameterType, so turning this off loses nothing.
reportUnknownParameterType = false

[tool.ruff]
line-length = 100
target-version = "py313"
# Generated by scripts/gen_ai_schemas.py, checked by its --check.
extend-exclude = ["research", "src/pyfect/ai/openai/generated", "src/pyfect/ai/openrouter/generated", "tests/oracle/_generated_code_sample.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL", "PERF"]
# UP046/UP047: Effect and Layer need explicit variance + PEP 696 defaults,
# which the PEP 695 class syntax cannot spell.
# PLR0913/PLR2004: combinator signatures and tests legitimately trip these.
ignore = ["UP046", "UP047", "PLR0913", "PLR2004", "PLC0415"]
