[project]
name = "pyfect-dev"
version = "0.6.9"
description = "Effect-TS for Python: typed effects, a real fiber runtime, structured concurrency, services and layers."
readme = "README.md"
authors = [{ name = "Tyler Gibbs", email = "tylergibbs048@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    # TypedDict extra_items (PEP 728) for the GraphQL error schemas.
    "typing-extensions>=4.13",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://pyfect.dev"
Repository = "https://github.com/tylergibbs1/pyfect"
Documentation = "https://pyfect.dev/docs"

[project.entry-points.pytest11]
pyfect = "pyfect.testing.plugin"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.45",
    "opentelemetry-sdk>=1.45",
]
hypothesis = [
    "hypothesis>=6.140",
]
pydantic = [
    "pydantic>=2.11",
]
msgspec = [
    "msgspec>=0.19",
]
httpx = [
    "httpx>=0.28",
]
websockets = [
    "websockets>=15",
]
pg = [
    "psycopg>=3.3",
]
mysql = [
    "asyncmy>=0.2.17",
]
mssql = [
    "python-tds>=1.17",
    "pyopenssl>=25",
]
server = [
    "uvicorn>=0.38",
    "websockets>=15",
]
http2 = [
    "hypercorn>=0.18",
]
# Deprecated: date_time.intl needs nothing extra now.
intl = []
regex = [
    "regex>=2024.11.6",
]
redis = [
    "redis>=8.1",
]
eventlog = [
    "cryptography>=46",
    "pynacl>=1.6",
]
brotli = [
    "brotlicffi>=1.2.1",
]
crypto = [
    "cryptography>=46",
    "pynacl>=1.6",
]
watch = [
    "watchfiles>=1.3",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# docs: the API reference generator, checked by tests/test_api_reference.py
default-groups = ["dev", "docs"]

[tool.uv.build-backend]
# The distribution is pyfect-dev (PyPI's pyfect is another project); the import name is pyfect.
module-name = "pyfect"

[dependency-groups]
dev = [
    "pyfect-dev[otel]",
    "pyfect-dev[hypothesis]",
    "pyfect-dev[pydantic]",
    "pyfect-dev[msgspec]",
    "pyfect-dev[httpx]",
    "pyfect-dev[websockets]",
    "pyfect-dev[pg]",
    "pyfect-dev[mysql]",
    "pyfect-dev[mssql]",
    "pyfect-dev[server]",
    "pyfect-dev[http2]",
    "pyfect-dev[intl]",
    "pyfect-dev[regex]",
    "pyfect-dev[redis]",
    "pyfect-dev[eventlog]",
    "pyfect-dev[brotli]",
    "pyfect-dev[crypto]",
    "pyfect-dev[watch]",
    "psycopg[binary]>=3.3",
    "mutmut>=3.8.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.2",
]
docs = ["griffe-typingdoc==0.2.9"]
# Atheris, the coverage-guided fuzzer tests/fuzz runs (`python -m fuzz`, from tests/); it has
# wheels for Linux only. On macOS build it with Homebrew's clang:
# CLANG_BIN=$(brew --prefix llvm)/bin/clang uv pip install atheris
fuzz = ["atheris==3.1.0; sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# An xfail that passes fails the run (tests/test_xfail_guard.py).
xfail_strict = true
# A coroutine left pending (a close never awaited before a loop stopped) or
# an exception raised where nothing can catch it fails the test that left it.
filterwarnings = [
    "error:coroutine .*was never awaited:RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    # `client[Group]` is deprecated; `cast` hides it from pyright, this does not.
    "error:client\\[Group\\]:DeprecationWarning",
    # A file, socket or pipe left for the garbage collector to close.
    "error::ResourceWarning",
    # run_blocking freezing a running asyncio loop; a test doing it on purpose says so.
    "error::pyfect.run.RunBlockingInEventLoopWarning",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests", "examples", "benchmarks", "scripts", "website/snippets"]
reportUnnecessaryTypeIgnoreComment = true
# Calling a deprecated API is an error.
reportDeprecated = "error"
exclude = ["research"]
pythonVersion = "3.13"
# Pyright infers the *send* type of an unannotated generator as Unknown
# (microsoft/pyright#10279). Effect generators never use the send type, but
# strict flags every one of them. Parameters are still required to be
# annotated by reportMissingParameterType, so turning this off loses nothing.
reportUnknownParameterType = false

[tool.ruff]
line-length = 100
target-version = "py313"
# Generated by scripts/gen_ai_schemas.py, checked by its --check.
extend-exclude = ["research", "src/pyfect/ai/openai/generated", "src/pyfect/ai/openrouter/generated", "tests/oracle/_generated_code_sample.py"]
# Also when a file is named on the command line (the pre-push hook, editors).
force-exclude = true

[tool.ruff.lint]
# Every rule ruff has, minus the ones below. ruff is pinned in uv.lock, so a
# ruff upgrade is the only way new rules arrive, and it shows up as a diff.
select = ["ALL"]
ignore = [
    # Conflict with `ruff format` (ruff's own formatter-conflict list).
    "COM812", "COM819", "ISC001", "ISC002", "Q000", "Q001", "Q002", "Q003", "W191",
    "E111", "E114", "E117",
    # D: docstring style; docstrings here are prose, not a numpydoc/google contract.
    "D",
    # CPY: LICENSE covers the repo; no per-file copyright headers.
    "CPY",
    # ANN: pyright strict already demands and checks every annotation it needs.
    "ANN",
    # TC001-TC003: annotations are evaluated at runtime (schema classes,
    # get_type_hints), so typing-only imports must stay real imports.
    "TC001", "TC002", "TC003",
    # S101: asserts state internal invariants and narrow types for pyright.
    "S101",
    # S105: fires on lexer variables named `token`; there are no passwords in source.
    "S105",
    # S104: servers bind every interface when no host is given, as Node does.
    "S104",
    # S311: Random mirrors Effect's Random, a non-cryptographic PRNG by design.
    "S311",
    # S603: the process and workers modules exist to start subprocesses.
    "S603",
    # S608: SQL statements interpolate configured table names; values are bound.
    "S608",
    # FBT: `succeed(True)` passes data, and boolean options mirror Effect's.
    "FBT",
    # A001-A004, A006: the API mirrors Effect's names (map, filter, all, id, ...).
    "A001", "A002", "A003", "A004", "A006",
    # N801/N802/N806/N815/N818: Effect's names (Schema constructors like Struct,
    # tagged errors without an Error suffix, camelCase wire fields).
    # N812: modules are imported under Effect's namespace names (`import ... as Effect`).
    "N801", "N802", "N806", "N812", "N815", "N818",
    # SLF001: package-internal modules share underscore members across files.
    "SLF001",
    # EM101/EM102/TRY003: a message variable per raise adds lines and catches nothing.
    "EM101", "EM102", "TRY003",
    # TRY004: switching ValueError to TypeError would change what pyfect raises.
    "TRY004",
    # RET503: the flagged functions end in a match that pyright proves exhaustive.
    "RET503",
    # ERA001: every hit is prose citing Effect's TypeScript, not dead code.
    "ERA001",
    # TRY301: raising inside try for local control flow is clearer than a helper.
    "TRY301",
    # BLE001: catching Exception is the runtime's contract: a raise becomes a Die.
    "BLE001",
    # C901: PLR0912 and PLR0915 already bound function size.
    "C901",
    # PTH: file_system and path mirror Node's string-path fs; pathlib normalises
    # paths (resolve() follows symlinks, Path drops trailing slashes) and would
    # change results.
    "PTH",
    # FLY002: a joined list of lines reads better than one long literal.
    "FLY002",
    # ASYNC109: `timeout` parameters are Effect-style options or third-party
    # interfaces (httpcore's network backend).
    "ASYNC109",
    # PYI051: `Literal["a"] | str` documents known values, like Effect's
    # `"a" | (string & {})`.
    "PYI051",
    # PIE807: pyright strict infers `default_factory=list` as list[Unknown];
    # `lambda: []` keeps the field's type.
    "PIE807",
    # PT012: tests of class-definition errors need a class body inside pytest.raises.
    "PT012",
    # PT009: flags Console.assert_ (Effect's console.assert); no unittest here.
    "PT009",
    # INT: no gettext; `_` is a throwaway name.
    "INT",
    # UP046/UP047: Effect and Layer need explicit variance and PEP 696 defaults,
    # which the PEP 695 syntax cannot spell.
    "UP046", "UP047",
    # PLR0913/PLR2004: combinator signatures and tests legitimately trip these.
    "PLR0913", "PLR2004",
    # PLC0415: function-level imports break import cycles and defer optional deps.
    "PLC0415",
    # Follow-ups, too many to fix in one reviewable change:
    # ARG (~1,350: fixtures used for side effects, interface overrides).
    "ARG",
    # PT018 (263 composite asserts in tests).
    "PT018",
    # PT011 (59 pytest.raises without match= in tests).
    "PT011",
]

# tests/ is not a package: its helpers are imported by module name (`from _growth import ...`).
# `from tests._x import` only works when the repo root happens to be on sys.path.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tests".msg = "tests/ is not a package; import its helpers by module name, e.g. `from _growth import ...`"

[tool.ruff.lint.per-file-ignores]
# Not packages: scripts, docs snippets, benchmarks and pytest's rootdir tests.
# They print, and run subprocesses and fixtures without security concerns.
"{tests,website,scripts,benchmarks,examples}/**" = ["INP001", "T201", "S"]
# Tests build naive datetimes on purpose, raise plain exceptions to stand in for
# user code, test hashing with single-item set membership, and poll state that
# other threads change.
"tests/**" = ["DTZ", "TRY002", "FURB171", "ASYNC110"]
# Snippets show plain asyncio code as people write it.
"website/**" = ["TRY300"]
